name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . -c .gitleaks.toml --redact --verbose --exit-code 1

  build-test:
    name: Build, formato, tests y cobertura
    runs-on: ubuntu-24.04
    needs: secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restaurar herramientas y paquetes
        run: |
          dotnet tool restore
          dotnet restore VulnManager.slnx
      - name: Formato (dotnet format)
        run: dotnet format VulnManager.slnx --verify-no-changes --no-restore
      - name: Build (warnings como errores, analizadores activos)
        run: dotnet build VulnManager.slnx -c Release --no-restore
      - name: Migraciones sincronizadas con el modelo
        run: dotnet ef migrations has-pending-model-changes -p src/VulnManager.Infrastructure -s src/VulnManager.Infrastructure --configuration Release --no-build
      - name: Tests unitarios e integración (Testcontainers + WireMock)
        run: >-
          dotnet test --solution VulnManager.slnx -c Release --no-build --
          --coverlet --coverlet-output-format cobertura
          --coverlet-include "[VulnManager.*]*" --coverlet-exclude "[VulnManager.*Tests]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"
          --results-directory "${{ github.workspace }}/artifacts/coverage"
      - name: Cobertura de la lógica de negocio (umbral 70 %)
        run: |
          dotnet reportgenerator -reports:"artifacts/coverage/*.cobertura*.xml" -targetdir:artifacts/coverage/report \
            -reporttypes:"TextSummary;MarkdownSummaryGithub" -assemblyfilters:"+VulnManager.Domain;+VulnManager.Application"
          cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check-coverage.py artifacts/coverage/report/Summary.txt 70
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: artifacts/coverage/report
          retention-days: 14

  docker:
    name: Imagen Docker, Trivy y SBOM propio
    runs-on: ubuntu-24.04
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir imagen
        run: docker build -t vuln-manager:ci .
      - name: Trivy (imagen oficial fijada) sobre la imagen
        # SeedData contiene SBOM de demostración con vulnerabilidades intencionales: no son dependencias de la app.
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          --skip-dirs app/SeedData --exit-code 1 vuln-manager:ci
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: SBOM CycloneDX de vuln-manager (se puede cargar en la propia plataforma)
        run: |
          dotnet tool restore
          dotnet CycloneDX src/VulnManager.Web/VulnManager.Web.csproj -rs -o artifacts/sbom -fn vuln-manager.cdx.json -F Json -sn vuln-manager -sv "1.0.${{ github.run_number }}" -spv 1.6
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/sbom/vuln-manager.cdx.json
          retention-days: 30
